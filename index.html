<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheminalGit - Plataforma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #161b22;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #30363d;
        }

        header h1 {
            color: #f0f6fc;
            font-size: 1.3rem;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Abas de Navegação no Login/Registo */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #30363d;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8b949e;
            padding: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 2px solid transparent;
            margin-top: 0;
        }

        .tab-btn.active {
            color: #f0f6fc;
            border-bottom-color: #f78166;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #c9d1d9;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        button {
            width: 100%;
            background-color: #238636;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .repo-list {
            margin-top: 1.5rem;
            list-style: none;
        }

        .repo-item {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .repo-item span {
            color: #58a6ff;
            font-weight: bold;
        }

        .badge-demo {
            background-color: #388bfd15;
            color: #58a6ff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            border: 1px solid #388bfd30;
        }

        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #484f58;
            font-size: 0.85rem;
            border-top: 1px solid #21262d;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="logo.png" alt="SheminalGit Logo" class="brand-logo">
            <h1>SheminalGit</h1>
        </a>
        <div id="user-nav" class="user-nav hidden">
            <span id="nav-username" style="color: #f0f6fc; font-weight: bold;"></span>
            <button onclick="logout()" class="btn-secondary" style="width: auto; padding: 0.4rem 0.8rem; margin: 0;">Sair</button>
        </div>
    </header>

    <main>
        <div class="container">
            
            <!-- TELA DE AUTENTICAÇÃO (CADASTRO / LOGIN) -->
            <div id="auth-card" class="card">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchTab('register')">Criar Conta</button>
                    <button class="tab-btn" onclick="switchTab('login')">Entrar na Conta</button>
                </div>

                <!-- FORMULÁRIO DE CRIAR CONTA -->
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="reg-username">Nome de Utilizador</label>
                        <input type="text" id="reg-username" placeholder="ex: dev-logic" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-email">E-mail</label>
                        <input type="email" id="reg-email" placeholder="teu@email.com" required>
                    </div>
                    <button type="submit">Criar Minha Conta</button>
                </form>

                <!-- FORMULÁRIO DE ENTRAR -->
                <form id="login-form" class="hidden" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="login-username">Nome de Utilizador</label>
                        <input type="text" id="login-username" placeholder="ex: dev-logic" required>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
            </div>

            <!-- TELA 2: PAINEL DA CONTA (URL: #your-account) -->
            <div id="dashboard-card" class="card hidden">
                <h2 style="color: #f0f6fc;">Painel Pessoal (<span id="profile-name"></span>)</h2>
                <p style="color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem;">Acedeste a: <code>your-account</code></p>

                <form id="repo-form" onsubmit="handleCreateRepo(event)">
                    <div class="input-group">
                        <label for="repo-name">Nome do Repositório</label>
                        <input type="text" id="repo-name" placeholder="ex: meu-primeiro-site" required>
                    </div>
                    <button type="submit">Criar Repositório (Simulação)</button>
                </form>

                <h3 style="margin-top: 2rem; color: #f0f6fc; font-size: 1.1rem;">Os teus Repositórios:</h3>
                <ul id="repo-list" class="repo-list"></ul>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 SheminalGit. Todos os direitos reservados.
    </footer>

    <script>
        function getUsersData() {
            const data = localStorage.getItem('sheminalgit_users');
            return data ? JSON.parse(data) : {};
        }

        function saveUsersData(data) {
            localStorage.setItem('sheminalgit_users', JSON.stringify(data));
        }

        function getCurrentUser() {
            return localStorage.getItem('sheminalgit_current_user');
        }

        // Alternar entre Criar Conta e Entrar
        function switchTab(tab) {
            const regForm = document.getElementById('register-form');
            const loginForm = document.getElementById('login-form');
            const tabs = document.querySelectorAll('.tab-btn');

            if (tab === 'register') {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                regForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        // 1. Cadastrar Conta
        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();

            let users = getUsersData();

            if (!users[username]) {
                users[username] = { email: email, repos: [] };
                saveUsersData(users);
            }

            localStorage.setItem('sheminalgit_current_user', username);
            showDashboard();
        }

        // 2. Entrar na Conta (Login)
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            let users = getUsersData();

            if (users[username]) {
                localStorage.setItem('sheminalgit_current_user', username);
                showDashboard();
            } else {
                alert('Esta conta não existe! Por favor, cria primeiro a tua conta.');
            }
        }

        // 3. Criar Repositório Falso
        function handleCreateRepo(e) {
            e.preventDefault();
            const repoName = document.getElementById('repo-name').value.trim();
            const currentUser = getCurrentUser();

            if (!currentUser) return;

            let users = getUsersData();
            if (users[currentUser]) {
                users[currentUser].repos.push({
                    name: repoName,
                    date: new Date().toLocaleDateString('pt-PT')
                });
                saveUsersData(users);
                document.getElementById('repo-name').value = '';
                renderRepos();
            }
        }

        function renderRepos() {
            const currentUser = getCurrentUser();
            const users = getUsersData();
            const listElement = document.getElementById('repo-list');
            listElement.innerHTML = '';

            if (users[currentUser] && users[currentUser].repos.length > 0) {
                users[currentUser].repos.forEach(repo => {
                    const li = document.createElement('li');
                    li.className = 'repo-item';
                    li.innerHTML = `
                        <div>
                            <span>${currentUser}/${repo.name}</span>
                            <br><small style="color: #8b949e;">Criado em ${repo.date}</small>
                        </div>
                        <span class="badge-demo">Simulado</span>
                    `;
                    listElement.appendChild(li);
                });
            } else {
                listElement.innerHTML = '<li style="color: #8b949e; font-size: 0.9rem;">Nenhum repositório criado ainda.</li>';
            }
        }

        // Entrar no Painel e Alterar URL para /your-account
        function showDashboard() {
            const currentUser = getCurrentUser();
            if (!currentUser) return;

            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('dashboard-card').classList.remove('hidden');
            document.getElementById('user-nav').classList.remove('hidden');
            
            document.getElementById('nav-username').innerText = currentUser;
            document.getElementById('profile-name').innerText = currentUser;

            // Altera o URL do navegador sem recarregar a página
            window.location.hash = 'your-account';

            renderRepos();
        }

        function logout() {
            localStorage.removeItem('sheminalgit_current_user');
            window.location.hash = '';
            document.getElementById('auth-card').classList.remove('hidden');
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('user-nav').classList.add('hidden');
        }

        window.onload = function() {
            if (getCurrentUser()) {
                showDashboard();
            }
        };
    </script>
</body>
</html>
