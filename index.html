<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheminalGit - Hospedagem e Projetos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        header {
            background-color: #161b22;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            color: #58a6ff;
            font-size: 1.5rem;
        }

        /* Conteúdo Principal */
        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .card h2 {
            margin-bottom: 1rem;
            color: #f0f6fc;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #8b949e;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <header>
        <h1>SheminalGit</h1>
    </header>

    <main>
        <div class="card">
            <h2>🚀 Criar Novo Projeto</h2>
            <form id="project-form">
                <div class="input-group">
                    <label for="username">Teu Nome de Utilizador (SheminalGit):</label>
                    <input type="text" id="username" placeholder="ex: dev_mestre" required>
                </div>
                <div class="input-group">
                    <label for="project-name">Nome do Projeto / Site:</label>
                    <input type="text" id="project-name" placeholder="ex: meu-primeiro-jogo" required>
                </div>
                <button type="submit">Publicar Projeto</button>
            </form>
        </div>
    </main>

</body>
</html>
